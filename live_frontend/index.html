<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}iframe{display:block;width:100%;border:0}
</style></head><body><iframe id="view" title="Giao lộ giả lập thời gian thực"></iframe><script>
const view=document.getElementById('view');let loaded=false,latest=null,html=null,sequence=0;
function send(type,fields={}){window.parent.postMessage({isStreamlitMessage:true,type,...fields},'*');}
function update(){if(loaded&&latest)view.contentWindow.postMessage({type:'traffic:state',state:latest},'*');}
view.addEventListener('load',()=>{loaded=true;update();});
window.addEventListener('message',event=>{
 const message=event.data||{};
 if(event.source===window.parent&&message.type==='streamlit:render'){
  latest=message.args.state;
  if(html!==message.args.html){loaded=false;html=message.args.html;view.srcdoc=html;}else update();
 }
 if(event.source===view.contentWindow){
  if(message.type==='traffic:height'){
   const height=Math.max(200,Math.ceil(message.height));view.style.height=height+'px';
   send('streamlit:setFrameHeight',{height});
  }
  if(message.type==='traffic:action'){
   send('streamlit:setComponentValue',{value:{action:message.action,id:Date.now()+'-'+(++sequence)},dataType:'json'});
  }
 }
});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:850});
</script></body></html>
